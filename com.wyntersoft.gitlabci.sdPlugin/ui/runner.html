<!DOCTYPE html>
<html>

<head lang="en">
	<title>Runner Status Settings</title>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="pi.css" />
	<script src="sdpi-components.js"></script>
</head>

<body>
	<h3 class="heading">Runner</h3>
	<sdpi-item label="Runner">
		<sdpi-select setting="runnerId" datasource="getRunners" show-refresh placeholder="Select a runner"></sdpi-select>
	</sdpi-item>
	<sdpi-item label="Label">
		<sdpi-textfield setting="label" placeholder="runner description"></sdpi-textfield>
	</sdpi-item>
	<sdpi-item label="Refresh">
		<sdpi-select setting="pollSeconds" default="60" value-type="number">
			<option value="15">15 seconds</option>
			<option value="30">30 seconds</option>
			<option value="60">1 minute</option>
			<option value="120">2 minutes</option>
			<option value="300">5 minutes</option>
		</sdpi-select>
	</sdpi-item>

	<h3 class="heading">GitLab account (all keys)</h3>
	<sdpi-item label="GitLab URL">
		<sdpi-textfield setting="gitlabUrl" global placeholder="https://gitlab.com"></sdpi-textfield>
	</sdpi-item>
	<sdpi-item label="Access token">
		<sdpi-password setting="token" global placeholder="read_api scope"></sdpi-password>
	</sdpi-item>

	<details>
		<summary>Override for this key</summary>
		<sdpi-item label="GitLab URL">
			<sdpi-textfield setting="gitlabUrl" placeholder="use account setting"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Access token">
			<sdpi-password setting="token" placeholder="use account setting"></sdpi-password>
		</sdpi-item>
	</details>
</body>

</html>
