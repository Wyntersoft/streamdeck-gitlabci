<!DOCTYPE html>
<html>

<head lang="en">
	<title>Branch Status Settings</title>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="pi.css" />
	<script src="sdpi-components.js"></script>
</head>

<body>
	<!-- Dials only: what turning the dial switches between. -->
	<div data-show="dial">
		<h3 class="heading">Dial</h3>
		<sdpi-item label="Turn to switch">
			<sdpi-select id="dialMode" setting="dialMode" default="branches">
				<option value="branches">branches of a project</option>
				<option value="projects">projects</option>
			</sdpi-select>
		</sdpi-item>
	</div>

	<h3 class="heading" data-show="key dial:branches">Pipeline</h3>
	<sdpi-item label="Project" data-show="key dial:branches">
		<sdpi-textfield setting="project" placeholder="group/project or URL"></sdpi-textfield>
	</sdpi-item>
	<sdpi-item label="Branch / tag" data-show="key">
		<sdpi-textfield setting="ref" placeholder="default branch"></sdpi-textfield>
	</sdpi-item>
	<sdpi-item label="Label" data-show="key">
		<sdpi-textfield setting="label" placeholder="project name"></sdpi-textfield>
	</sdpi-item>

	<sdpi-item label="Branches" data-show="dial:branches">
		<sdpi-textarea setting="dialList" rows="4" placeholder="one per line, e.g.&#10;main&#10;develop&#10;&#10;leave blank for the recently updated branches"></sdpi-textarea>
	</sdpi-item>
	<sdpi-item label="Projects" data-show="dial:projects">
		<sdpi-textarea setting="dialList" rows="5" placeholder="one per line, e.g.&#10;group/project&#10;group/other@develop&#10;&#10;(@branch is optional; default branch otherwise)"></sdpi-textarea>
	</sdpi-item>

	<h3 class="heading">Actions</h3>
	<sdpi-item label="Retry">
		<sdpi-checkbox setting="allowRetry" default="true" label="Tap / push retries failed jobs (red or yellow)"></sdpi-checkbox>
	</sdpi-item>
	<sdpi-item label="Cancel">
		<sdpi-checkbox setting="allowCancel" default="true" label="Hold cancels a running pipeline"></sdpi-checkbox>
	</sdpi-item>
	<sdpi-item label="Refresh">
		<sdpi-select setting="pollSeconds" default="60" value-type="number">
			<option value="15">15 seconds</option>
			<option value="30">30 seconds</option>
			<option value="60">1 minute</option>
			<option value="120">2 minutes</option>
			<option value="300">5 minutes</option>
		</sdpi-select>
	</sdpi-item>

	<h3 class="heading">GitLab account (all keys)</h3>
	<sdpi-item label="GitLab URL">
		<sdpi-textfield setting="gitlabUrl" global placeholder="https://gitlab.com"></sdpi-textfield>
	</sdpi-item>
	<sdpi-item label="Access token">
		<sdpi-password setting="token" global placeholder="token with api scope"></sdpi-password>
	</sdpi-item>
	<p class="hint">Personal access token with the <b>api</b> scope. A <b>read_api</b> token only shows status; retry and cancel need <b>api</b>. Runner keys need access to the runners (admin for instance runners).</p>

	<details>
		<summary>Override for this key</summary>
		<sdpi-item label="GitLab URL">
			<sdpi-textfield setting="gitlabUrl" placeholder="use account setting"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Access token">
			<sdpi-password setting="token" placeholder="use account setting"></sdpi-password>
		</sdpi-item>
	</details>

	<script>
		// Show only the fields that apply: keys watch one project/branch; dials turn through a list whose meaning
		// depends on the dial mode. Elements list where they apply in data-show, e.g. "key dial:branches".
		const { streamDeckClient } = SDPIComponents;
		let controller = "Keypad";
		let mode = "branches";

		function update() {
			const context = controller === "Encoder" ? ["dial", `dial:${mode}`] : ["key"];
			for (const el of document.querySelectorAll("[data-show]")) {
				el.hidden = !el.dataset.show.split(" ").some((place) => context.includes(place));
			}
		}

		update();
		streamDeckClient.getConnectionInfo().then(({ actionInfo }) => {
			controller = actionInfo.payload.controller;
			mode = actionInfo.payload.settings.dialMode || "branches";
			update();
		});
		// sdpi-components fires "valuechange" when the user picks an option.
		document.getElementById("dialMode").addEventListener("valuechange", (ev) => {
			mode = ev.target.value || "branches";
			update();
		});
	</script>
</body>

</html>
